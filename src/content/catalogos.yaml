# Catálogos y fichas técnicas (PDF propios o catálogo online de la marca).
# Salen en su categoría (página de la familia) y todos juntos en /catalogos.
#
# Cómo añadir uno:
#   1. Deja el PDF en public/catalogos/<categoria>/<nombre-sin-acentos>.pdf (comprimido: ver docs/CATALOGOS.md)
#   2. Añade aquí una entrada. Las páginas y el peso se calculan solos al compilar.
# Campos: titulo · marca (opcional) · categorias (uno o varios slugs de src/content/categorias)
#         archivo (ruta dentro de public/catalogos) o enlace (web de la marca) · ano (opcional) · publicar (true por defecto)
# Origen: catálogos de la web antigua (docs/CATALOGOS.md), pendientes de revisión por el equipo comercial.

